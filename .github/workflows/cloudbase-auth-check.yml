name: CloudBase authorization check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudbase-online-1.4.0
    paths:
      - .github/workflows/cloudbase-auth-check.yml

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@latest
      - name: Authenticate with the environment API key
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDBASE_API_KEY" || { echo "CLOUDBASE_API_KEY is missing"; exit 1; }
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" --env-id twentyfour-d3gpwyy2p3484bd77
      - name: Verify CloudBase CLI environment access
        run: |
          set -euo pipefail
          tcb env list --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const result = JSON.parse(s);
              const envs = result.data || result.EnvList || [];
              const found = envs.some(env => env.EnvId === "twentyfour-d3gpwyy2p3484bd77");
              if (!found) process.exit(1);
              console.log("CloudBase environment authorization verified.");
            });
          '
      - name: Diagnose document database access
        run: |
          set -uo pipefail
          set +e
          tcb db nosql execute \
            --command '{"listCollections":1}' \
            --env-id twentyfour-d3gpwyy2p3484bd77 --json > "$RUNNER_TEMP/cloudbase-db.json" 2> "$RUNNER_TEMP/cloudbase-db.err"
          cli_status=$?
          set -e
          CLI_STATUS="$cli_status" node -e '
            const fs = require("fs");
            const path = process.env.RUNNER_TEMP;
            let root = {};
            try { root = JSON.parse(fs.readFileSync(path + "/cloudbase-db.json", "utf8")); }
            catch { console.log("Database CLI returned non-JSON output."); }
            const codes = [];
            const stack = [root];
            while (stack.length) {
              const value = stack.pop();
              if (!value || typeof value !== "object") continue;
              for (const [key, child] of Object.entries(value)) {
                if (/code/i.test(key) && typeof child === "string") codes.push(child);
                if (child && typeof child === "object") stack.push(child);
              }
            }
            console.log("Database API error codes:", [...new Set(codes)].join(",") || "none returned");
            const err = fs.readFileSync(path + "/cloudbase-db.err", "utf8");
            if (err) console.log("CLI stderr present:", err.trim().length > 0);
          ' 
          echo "Database command exit code: $cli_status"
          test "$cli_status" -eq 0
