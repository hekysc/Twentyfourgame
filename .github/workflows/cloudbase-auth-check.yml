name: CloudBase authorization check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudbase-online-1.4.0
    paths:
      - .github/workflows/cloudbase-auth-check.yml

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@latest
      - name: Authenticate with the environment API key
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDBASE_API_KEY" || { echo "CLOUDBASE_API_KEY is missing"; exit 1; }
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" --env-id twentyfour-d3gpwyy2p3484bd77
      - name: Verify CloudBase CLI environment access
        run: |
          set -euo pipefail
          tcb env list --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const result = JSON.parse(s);
              const envs = result.data || result.EnvList || [];
              const found = envs.some(env => env.EnvId === "twentyfour-d3gpwyy2p3484bd77");
              if (!found) process.exit(1);
              console.log("CloudBase environment authorization verified.");
            });
          '
      - name: Verify read-only Cloud API management access
        run: |
          set -euo pipefail
          tcb api tcb DescribeEnvs \
            --body '{"EnvId":"twentyfour-d3gpwyy2p3484bd77"}' \
            --api-version 2018-06-08 --json > "$RUNNER_TEMP/cloudbase-env.json"
          node -e '
            const fs = require("fs");
            const root = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/cloudbase-env.json", "utf8"));
            const stack = [root];
            let found = false;
            const apiErrors = [];
            while (stack.length) {
              const value = stack.pop();
              if (typeof value === "string") {
                if (value === "twentyfour-d3gpwyy2p3484bd77") found = true;
              } else if (value && typeof value === "object") {
                if (value.EnvId === "twentyfour-d3gpwyy2p3484bd77") found = true;
                if (value.Error && value.Error.Code) apiErrors.push(value.Error.Code);
                if (Array.isArray(value)) stack.push(...value);
                else stack.push(...Object.values(value));
              }
            }
            if (!found) {
              console.log("Cloud API response fields:", Object.keys(root).join(","));
              if (apiErrors.length) console.log("Cloud API error codes:", apiErrors.join(","));
              process.exit(1);
            }
            console.log("Read-only Cloud API access verified.");
          '
