name: CloudBase dev deployment and verification

on:
  push:
    branches:
      - main
      - fix/round-settlement-flow
      - feat/batch-prefetch-offline-sync
    paths:
      - .github/workflows/cloudbase-deploy.yml
      - cloudfunctions/tf24/**
      - scripts/cloudbase-admin.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-dev-twentyfour
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/round-settlement-flow' || github.ref == 'refs/heads/feat/batch-prefetch-offline-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false
      - name: Verify backend rules before deployment
        run: node --test tests/backend.test.cjs tests/online-rules.test.cjs
      - name: Install cloud function dependencies
        run: npm ci --prefix cloudfunctions/tf24 --ignore-scripts
      - name: Provision secured collections and deploy function
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          CLOUDBASE_ENV_ID: twentyfour-d6g4wbv3c4f226753
        run: |
          set -euo pipefail
          test -n "$TENCENTCLOUD_SECRET_ID" || { echo "::error::TENCENTCLOUD_SECRET_ID is missing"; exit 1; }
          test -n "$TENCENTCLOUD_SECRET_KEY" || { echo "::error::TENCENTCLOUD_SECRET_KEY is missing"; exit 1; }
          python3 scripts/cloudbase-admin.py deploy --auth-dir "$RUNNER_TEMP/cloudbase-auth"
          python3 scripts/cloudbase-admin.py check --auth-dir "$RUNNER_TEMP/cloudbase-auth"
