name: WeChat Mini Program

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload a WeChat development version
        required: true
        type: boolean
        default: false
      version:
        description: WeChat version, for example 1.0.1
        required: false
        type: string
      description:
        description: Upload description
        required: false
        type: string
        default: Automated upload from Twentyfourgame

permissions:
  contents: read

concurrency:
  group: wechat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build mp-weixin
        run: npm run build:mp-weixin
      - name: Verify build output
        run: |
          test -f dist/build/mp-weixin/app.js
          test -f dist/build/mp-weixin/app.json
          test -f dist/build/mp-weixin/project.config.json
          test -f dist/build/mp-weixin/pages/index/index.wxml
      - uses: actions/upload-artifact@v6
        with:
          name: mp-weixin
          path: dist/build/mp-weixin
          if-no-files-found: error
          retention-days: 30

      - name: Validate release inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          WECHAT_VERSION: ${{ inputs.version }}
        run: |
          test -n "$WECHAT_VERSION"
          if ! printf '%s' "$WECHAT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta."
            exit 1
          fi

      - name: Prepare WeChat private key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          test -n "$WECHAT_PRIVATE_KEY"
          printf '%s' "$WECHAT_PRIVATE_KEY" > "$RUNNER_TEMP/wechat.key"
          chmod 600 "$RUNNER_TEMP/wechat.key"

      - name: Upload WeChat development version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat.key
          WECHAT_VERSION: ${{ inputs.version }}
          WECHAT_DESC: ${{ inputs.description }}
          WECHAT_APPID: wx58faf81d08ca037c
          WECHAT_PROJECT_PATH: dist/build/mp-weixin
        run: npm run wechat:upload

      - name: Generate WeChat preview QR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat.key
          WECHAT_VERSION: ${{ inputs.version }}
          WECHAT_DESC: ${{ inputs.description }}
          WECHAT_APPID: wx58faf81d08ca037c
          WECHAT_PROJECT_PATH: dist/build/mp-weixin
          WECHAT_QR_PATH: ${{ runner.temp }}/wechat-preview.jpg
        run: npm run wechat:preview

      - name: Upload preview QR artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        uses: actions/upload-artifact@v6
        with:
          name: wechat-preview-qr-${{ inputs.version }}
          path: ${{ runner.temp }}/wechat-preview.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Remove WeChat private key
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: rm -f "$RUNNER_TEMP/wechat.key" "$RUNNER_TEMP/wechat-preview.jpg"
